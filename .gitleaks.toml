# Secret scan of the public repository (M1-15): gitleaks' default rules plus
# rules for values that identify a real deployment. Real project ids, project
# numbers, and service URLs live only in the private deployment repository;
# this repository uses placeholders (<project>, example-project) and fake ids.
# Run: sh test/ci/secret-scan.sh

title = "pubcommittee"

[extend]
useDefault = true

# A Google Cloud project id with an environment and a random suffix, the shape
# the deployment repository uses (name-env-xxxx), for example in a bucket,
# service account, or Hosting site name. The suffix holds a digit, so word
# names such as "<project>-test-http" do not match.
[[rules]]
id = "gcp-project-id-env"
description = "Google Cloud project id with an environment and a random suffix"
regex = '''\b[a-z][a-z0-9-]{2,20}-(?:dev|staging|prod|test)-(?:[0-9][a-z0-9]{3,5}|[a-z][0-9][a-z0-9]{2,4}|[a-z]{2}[0-9][a-z0-9]{1,3}|[a-z]{3}[0-9][a-z0-9]{0,2})\b'''
tags = ["gcp", "deployment"]

  # Year-suffixed names (run ids, labels) are not project ids.
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''-(?:19|20)[0-9]{2}$''']

# A Google Cloud project id with the console's default 6-digit suffix.
[[rules]]
id = "gcp-project-id-default"
description = "Google Cloud project id with a 6-digit suffix"
regex = '''\b(?:projects/|project[ _-]?id["' =:]+)[a-z][a-z0-9-]{3,22}-[0-9]{6}\b'''
tags = ["gcp", "deployment"]

# A Google Cloud project number in a resource name or default service account.
[[rules]]
id = "gcp-project-number"
description = "Google Cloud project number"
regex = '''(?:projects/[0-9]{9,13}\b|\b[0-9]{9,13}-compute@developer\.gserviceaccount\.com|service-[0-9]{9,13}@)'''
tags = ["gcp", "deployment"]

# A deployed Cloud Run service URL (name-hash-region.a.run.app or
# name-projectnumber.region.run.app).
[[rules]]
id = "cloud-run-url"
description = "Deployed Cloud Run service URL"
regex = '''\b[a-z0-9-]+-(?:[a-z0-9]{10}-[a-z]{2}\.a|[0-9]{9,13}\.[a-z]+-[a-z]+[0-9])\.run\.app\b'''
tags = ["gcp", "deployment"]

[allowlist]
description = "Generated and vendored files"
# Private folders (deploy/, contacts/, .local-data/, .env*) are deliberately not
# listed: committed by mistake, they must fail the scan. Scan a CI checkout or a
# worktree, never a checkout that holds them.
paths = [
  '''(?:^|/)node_modules/''',
  '''(?:^|/)package-lock\.json$''',
  '''(?:^|/)go\.sum$''',
]
