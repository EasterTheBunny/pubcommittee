name: accuracy
# Accuracy checks of AI-generated content (M1-09). CI never calls a model: the default run uses
# fakegen. Live model runs sit behind the repository variable LIVE_MODEL_RUNS, which is unset (off)
# by default; the job below only reports that they are not enabled. M1 runs them on the operator's
# machine (stage L3), never in CI, and no model key is given to this workflow.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Request a live model run (off; ignored unless the repository variable LIVE_MODEL_RUNS is true)"
        type: boolean
        default: false
  pull_request:
    paths: ["internal/generate/**", "internal/accuracy/**", "internal/adapters/claude/**", "internal/adapters/fakegen/**", "cmd/job-summarize/**", "cmd/accuracy-report/**"]

permissions:
  contents: read

jobs:
  fakegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the development image
        run: docker build -f docker/dev.Dockerfile -t pc-dev:ci .
      - name: Generation tests and planted errors on fakegen
        run: |
          docker run --rm --cpus 2 --memory 4g -v "$PWD":/src -w /src \
            -v pc-gomod:/go/pkg/mod -v pc-gocache:/root/.cache/go-build \
            pc-dev:ci sh -c '
              set -eu
              # api/check.sh lints the spec and regenerates types with tools from app/node_modules.
              (cd app && npm ci)
              sh test/acceptance/M1-09/run.sh
            '
  live:
    runs-on: ubuntu-latest
    if: ${{ vars.LIVE_MODEL_RUNS == 'true' && inputs.live }}
    steps:
      - name: Live runs are not wired in M1
        run: |
          echo "Live model runs are an operator step (stage L3) and are not run by CI."
          exit 1
