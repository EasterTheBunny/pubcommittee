name: backend
on:
  push:
    # Branches only: a release tag points at a main commit that already passed CI.
    branches: ["**"]
    paths-ignore: ["app/**", "demo/**", "design/**", "architecture/**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the development image
        run: docker build -f docker/dev.Dockerfile -t pc-dev:ci .
      - name: Run checks in the development image
        run: |
          docker run --rm --cpus 2 --memory 4g -v "$PWD":/src -w /src \
            -v pc-gomod:/go/pkg/mod -v pc-gocache:/root/.cache/go-build \
            pc-dev:ci sh -c '
              set -eu
              test -z "$(gofmt -l cmd internal)"
              go vet -tags memory ./...
              # One lint run per build target: memory uses the repository config; the others use
              # it without run.build-tags (the config pins memory).
              go tool golangci-lint run ./...
              sed "/^  build-tags:/,/^    - memory/d" .golangci.yml > /tmp/gl.yml
              for tag in local gcp emulator; do
                go tool golangci-lint run --config /tmp/gl.yml --build-tags "$tag" ./...
              done
              (cd app && npm ci)
              sh api/check.sh
              go test -tags memory -count=1 ./...
              sh test/ci/tags.sh
              sh test/ci/deps.sh
              sh test/ci/size.sh
              sh test/ci/deps_test.sh
            '
  emulators:
    # Conformance of the cloud adapters (M1-03b) against the Cloud Storage stand-in and the
    # Firestore emulator, from the emulator profile of compose.yaml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the development image
        run: docker build -f docker/dev.Dockerfile -t pc-dev:ci .
      - name: Start the emulators
        run: docker compose --profile emulator up -d gcs-emulator firestore-emulator
      - name: Run the cloud adapter tests
        run: |
          docker run --rm --cpus 2 --memory 3g --network pubcommittee_default -v "$PWD":/src -w /src \
            -v pc-gomod:/go/pkg/mod -v pc-gocache:/root/.cache/go-build \
            -e STORAGE_EMULATOR_HOST=gcs-emulator:4443 -e FIRESTORE_EMULATOR_HOST=firestore-emulator:8080 \
            -e PC_REQUIRE_EMULATORS=1 pc-dev:ci sh -c '
              set -eu
              until wget -qO- http://firestore-emulator:8080/ >/dev/null 2>&1; do sleep 2; done
              go test -tags memory -race -count=1 ./internal/adapters/gcs/... ./internal/adapters/firestore/... ./internal/cloudports/...
            '
      - name: Stop the emulators
        if: always()
        run: docker compose --profile emulator down -v
  image:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build read-api for both architectures with an SBOM
        run: |
          docker buildx build -f docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg SERVICE=read-api --build-arg TARGET=memory \
            --build-arg COMMIT="$GITHUB_SHA" \
            --sbom=true --provenance=false \
            -t pc-read-api:ci .
