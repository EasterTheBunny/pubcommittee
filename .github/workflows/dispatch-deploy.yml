name: dispatch-deploy

# Sends one signed trigger to the private deployment repository naming the commit
# to deploy (M1-17). No cloud credential, plan output or environment value is
# here: the deploy itself runs and logs only in the private repository, which
# verifies the commit against this repository's main before building anything.
on:
  # Every CI workflow that can run on a push to main. A commit that changes only
  # app/ runs web and not backend, so each one's completion is a chance to dispatch.
  workflow_run:
    workflows: [backend, web, infra]
    types: [completed]
    branches: [main]
  push:
    # Application releases only: release candidates (vX.Y.Z-rcN, staging) and releases
    # (vX.Y.Z, staging then prod; M1-17b). Module tags use modules/vX.Y.Z and never match.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"]

permissions: {}

concurrency:
  group: dispatch-deploy-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  gate:
    # A main deploy only after a successful CI run on a push to main. Then every CI
    # workflow that ran for that push must have succeeded. Workflows skipped by their
    # path filters do not count. While one is still running, this run stops quietly
    # and that workflow's own completion starts a new check. A tag push needs no
    # gate: promote accepts only a commit that dev ran, which passed this gate.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      actions: read # list this commit's CI runs
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ "$EVENT" = push ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          runs=$(gh api "repos/$REPO/actions/runs?head_sha=$RUN_SHA&event=push&branch=main&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "backend" or .name == "web" or .name == "infra")]
                  | group_by(.name) | map(max_by(.run_attempt))
                  | map("\(.name) \(.status) \(.conclusion // "none")") | .[]')
          echo "$runs"
          if echo "$runs" | grep -qv ' completed '; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CI still running for $RUN_SHA: no dispatch from this run"
            exit 0
          fi
          if echo "$runs" | grep -qv ' completed success$'; then
            echo "CI failed for $RUN_SHA: no dispatch" >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Secrets DEPLOY_APP_ID, DEPLOY_APP_KEY, DEPLOY_OWNER and DEPLOY_REPO: the App, and the
    # private repository's owner and name (secrets so they are masked in logs). The App is
    # owned by and installed on that owner, which may differ from this repository's.
    # Deployment branches and tags limited to main and v* (release tags).
    environment: deploy-trigger
    steps:
      - id: what
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            sha=$TAG_SHA kind=release tag=$REF_NAME
          else
            sha=$RUN_SHA kind=main tag=
          fi
          { echo "sha=$sha"; echo "kind=$kind"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_KEY }}
          owner: ${{ secrets.DEPLOY_OWNER }}
          repositories: ${{ secrets.DEPLOY_REPO }}
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ secrets.DEPLOY_OWNER }}/${{ secrets.DEPLOY_REPO }}
          SHA: ${{ steps.what.outputs.sha }}
          KIND: ${{ steps.what.outputs.kind }}
          TAG: ${{ steps.what.outputs.tag }}
        run: |
          jq -n --arg sha "$SHA" --arg kind "$KIND" --arg tag "$TAG" \
            '{event_type: "deploy", client_payload: {sha: $sha, kind: $kind, tag: $tag}}' |
            gh api --silent "repos/$REPO/dispatches" --input -
          echo "dispatched $KIND $SHA"
