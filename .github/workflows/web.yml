name: web
on:
  push:
    paths: ["app/**", "demo/**", "api/**", ".github/workflows/web.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    # The archived M0 demo: type-checked and built with its own dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and build demo/
        run: |
          docker run --rm --cpus 2 --memory 3g -v "$PWD":/src -w /src/demo \
            node:24-bookworm-slim sh -c 'npm ci && npm run check && npm run build'
