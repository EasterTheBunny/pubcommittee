name: secret-scan
on:
  # Pull requests into main only: main takes no direct commits, so a clean pull
  # request keeps main clean. Make the "scan" check required on main.
  pull_request:
    branches: [main]

permissions:
  contents: read

# Secret scan of the tree (M1-15): gitleaks' default rules plus the deployment
# value rules in .gitleaks.toml, and planted values the scan must find. Every
# pull request runs it, so there is no path filter.
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan the tree and check the planted values
        run: |
          docker run --rm --network none --cpus 1 --memory 1g \
            -v "$PWD":/src:ro -w /src --entrypoint sh \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            test/ci/secret-scan.sh
